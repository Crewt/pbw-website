<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kurs - PBW - Beatrice Czekalla</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .sem-hero {
      position: relative;
      overflow: hidden;
      background: var(--bg-alt);
      padding: 64px 0 48px;
      border-bottom: 1px solid var(--line);
    }

    .sem-hero-bg {
      position: absolute;
      inset: 0;
      background: url("assets/header-bg.png") center/cover no-repeat;
      opacity: 0.20;
    }

    .sem-hero-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(243, 244, 244, 0.4) 0%, rgba(243, 244, 244, 0.85) 100%);
    }

    .sem-hero-inner {
      position: relative;
      z-index: 1;
    }

    .sem-hero h1 {
      font-size: 48px;
      line-height: 1.05;
      letter-spacing: -1px;
      color: var(--ink);
      margin: 0 0 12px;
    }

    .sem-hero .lead {
      font-size: 18px;
      color: var(--text);
      max-width: 720px;
      margin: 0;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--slate);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
      transition: color .15s ease, gap .15s ease;
    }

    .back-link:hover {
      color: var(--navy);
      gap: 10px;
    }

    .back-link svg {
      width: 14px;
      height: 14px;
    }

    .sem-layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 48px;
      margin: 64px 0;
      align-items: start;
    }

    .sem-main p {
      color: var(--text);
      font-size: 16px;
      line-height: 1.7;
      margin: 0 0 16px;
    }

    .seminar-img {
      margin: 32px 0;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16/9;
      background: linear-gradient(135deg, #d8e3f7, #b6c6e0);
    }

    .seminar-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .sub-h {
      font-size: 22px;
      color: var(--ink);
      margin: 40px 0 16px;
      font-weight: 700;
    }

    .benefits {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 8px;
    }

    .benefit {
      background: var(--bg-alt);
      border-radius: 8px;
      padding: 16px 18px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .benefit svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      color: var(--navy);
      margin-top: 2px;
    }

    .benefit p {
      margin: 0;
      font-size: 15px;
      line-height: 1.5;
      color: var(--ink);
    }

    .bullets {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bullet {
      border-left: 2px solid var(--navy);
      padding: 12px 16px;
      background: rgba(243, 244, 244, 0.6);
      border-radius: 0 6px 6px 0;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.5;
    }

    /* sidebar booking card */
    .sem-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 28px;
      position: sticky;
      top: 90px;
      box-shadow: var(--shadow-soft);
    }

    .sem-card .kicker {
      display: block;
      margin-bottom: 20px;
    }

    .sem-card .row {
      gap: 14px;
      align-items: flex-start;
      margin-bottom: 16px;
      display: flex;
    }

    .sem-card .row:last-of-type {
      margin-bottom: 0;
    }

    .sem-card .row small {
      color: var(--text);
      font-size: 13px;
      display: block;
      margin-bottom: 2px;
    }

    .sem-card .row strong {
      color: var(--ink);
      font-size: 15px;
      font-weight: 600;
      display: block;
    }

    .sem-card .price {
      color: var(--navy);
      font-size: 20px;
      font-weight: 700;
    }

    .sem-card hr {
      border: 0;
      border-top: 1px solid var(--line-soft);
      margin: 20px 0;
    }

    .sem-card p {
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 16px;
    }

    .term-list {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 14px;
    }

    .term-list li {
      padding: 6px 0;
      color: var(--ink);
      border-bottom: 1px solid var(--line-soft);
    }

    .term-list li:last-child {
      border-bottom: 0;
    }

    .term-list .t-date {
      font-weight: 600;
      color: var(--navy);
    }

    .term-list .t-time {
      color: var(--text);
      margin-left: 6px;
      font-size: 13px;
    }

    .not-found {
      padding: 96px 0;
      text-align: center;
    }

    .not-found h1 {
      font-size: 36px;
      color: var(--ink);
      margin: 0 0 12px;
    }

    .not-found p {
      color: var(--text);
      margin: 0 0 24px;
    }

    @media (max-width: 900px) {
      .sem-hero h1 {
        font-size: 36px;
      }

      .sem-layout {
        grid-template-columns: 1fr;
      }

      .sem-card {
        position: static;
      }

      .benefits {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header class="nav">
    <div class="container nav-inner">
      <a href="MainPage.html" class="nav-brand"><img src="assets/logo.png" alt="PBW - Beatrice Czekalla"
          class="nav-logo" /></a>
      <nav>
        <ul class="nav-links">
          <li><a href="MainPage.html">Home</a></li>
          <li><a href="ueber-mich.html">Über mich</a></li>
          <li><a href="kurstermine.html" class="active">Kurstermine</a></li>
          <li><a href="empfehlungen.html">Empfehlungen</a></li>
        </ul>
      </nav>
      <a href="kontakt.html" class="nav-cta">Kontakt</a>
    </div>
  </header>

  <main id="seminarRoot" data-screen-label="03 Seminar Detail"></main>

  <footer class="footer">
    <div class="container footer-row">
      <div>
        <div class="footer-brand">Beatrice Czekalla (PBW)</div>
        <p class="footer-copy">© 2024 Beatrice Czekalla (PBW). Alle Rechte vorbehalten.</p>
      </div>
      <div>
        <h4>Navigation</h4>
        <ul class="footer-links">
          <li><a href="#">Impressum</a></li>
          <li><a href="#">Datenschutz</a></li>
          <li><a href="kontakt.html">Kontakt</a></li>
        </ul>
      </div>
      <div>
        <h4>Mehr</h4>
        <ul class="footer-links">
          <li><a href="/admin">Admin-Bereich</a></li>
          <li><a href="#">Newsletter</a></li>
        </ul>
      </div>
    </div>
  </footer>

  <script src="js/store.js"></script>
  <script>
    (function () {
      const { Store, fmtDate } = window.PBW;
      const root = document.getElementById("seminarRoot");

      const params = new URLSearchParams(location.search);
      const id = params.get("id");

      let course;
      if (id) {
        course = Store.get(id);
      } else {
        // default: show first course or "Von der Angst zum Mut"
        course = Store.get("c-angst") || Store.all()[0];
      }

      if (!course) {
        root.innerHTML = `
      <div class="container not-found">
        <h1>Kurs nicht gefunden</h1>
        <p>Der gewünschte Kurs ist nicht (mehr) verfügbar.</p>
        <a class="btn btn-primary" href="kurstermine.html">Zu den Kursangeboten</a>
      </div>`;
        document.title = "Kurs nicht gefunden - PBW";
        return;
      }

      document.title = course.title + " - PBW - Beatrice Czekalla";

      const paragraphs = (course.description || "")
        .split(/\n\s*\n/)
        .map(p => `<p>${escapeHtml(p).replace(/\n/g, "<br/>")}</p>`)
        .join("");

      const includes = (course.includes || []).map(s => `
    <div class="benefit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
      <p>${escapeHtml(s)}</p>
    </div>`).join("");

      const enables = (course.enables || []).map(s => `<li class="bullet">${escapeHtml(s)}</li>`).join("");

      const termineList = (course.termine || []).map(t => `
    <li><span class="t-date">${escapeHtml(fmtDate(t.date))}</span>${t.time ? `<span class="t-time">${escapeHtml(t.time)}</span>` : ""}</li>
  `).join("");

      const imgBlock = course.image
        ? `<div class="seminar-img"><img src="${course.image}" alt=""/></div>`
        : `<div class="seminar-img" aria-hidden="true"></div>`;

      root.innerHTML = `
    <section class="sem-hero">
      <div class="sem-hero-bg"></div>
      <div class="container sem-hero-inner">
        <a href="kurstermine.html" class="back-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          Alle Kursangebote
        </a>
        <span class="kicker">Kursangebot</span>
        <h1>${escapeHtml(course.title)}</h1>
        ${course.subtitle ? `<p class="lead">${escapeHtml(course.subtitle)}</p>` : ""}
      </div>
    </section>

    <div class="container">
      <div class="sem-layout">
        <article class="sem-main">
          ${paragraphs || `<p>Beschreibung folgt in Kürze.</p>`}

          ${imgBlock}

          ${includes ? `
            <h2 class="sub-h">Im Seminar erhalten Sie…</h2>
            <div class="benefits">${includes}</div>
          ` : ""}

          ${enables ? `
            <h2 class="sub-h">Das Seminar ermöglicht Ihnen…</h2>
            <ul class="bullets">${enables}</ul>
          ` : ""}
        </article>

        <aside>
          <div class="sem-card">
            <span class="kicker">Seminardetails</span>

            ${termineList ? `
              <div class="row">
                <span class="icon-chip-blue">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                </span>
                <div style="flex:1;">
                  <small>Termine</small>
                  <ul class="term-list">${termineList}</ul>
                </div>
              </div>
            ` : ""}

            ${course.cost ? `
              <div class="row">
                <span class="icon-chip-blue">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg>
                </span>
                <div>
                  <small>Kosten</small>
                  <strong class="price">${escapeHtml(course.cost)}</strong>
                </div>
              </div>
            ` : ""}

            <hr/>

            <p>Nehmen Sie Kontakt auf, um weitere Informationen zu erhalten und sich anzumelden.</p>
            <a href="kontakt.html?kurs=${encodeURIComponent(course.title)}" class="btn btn-primary btn-block">Jetzt Kontakt aufnehmen</a>
          </div>
        </aside>
      </div>
    </div>
  `;

      function escapeHtml(s) {
        return String(s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
      }
    })();
  </script>

</body>

</html>
